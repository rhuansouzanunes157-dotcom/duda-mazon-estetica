<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Duda Mazon Estética</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450..700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F3EEF0;
    --surface:#FFFFFF;
    --surface-muted:#FBF6F8;
    --line:#E6DEE2;
    --ink:#2A2229;
    --ink-dim:#6E6169;
    --ink-faint:#9C8F96;
    --primary:#4B3550;
    --primary-ink:#FFFFFF;
    --primary-tint:#EDE4EF;
    --accent:#BE8A3D;
    --accent-tint:#F6EAD3;
    --success:#3D7A54;
    --success-tint:#E1EFE4;
    --danger:#B14432;
    --danger-tint:#F6E2DE;
    --warning:#C1691F;
    --warning-tint:#F8E6D4;
    --shadow: 0 1px 2px rgba(42,34,41,0.06), 0 8px 24px -12px rgba(42,34,41,0.18);
    --radius: 14px;
    --radius-sm: 9px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1D1720;
      --surface:#272029;
      --surface-muted:#231D26;
      --line:#3B3340;
      --ink:#F1EBEE;
      --ink-dim:#B9AEB6;
      --ink-faint:#8A7E86;
      --primary:#C9A8DA;
      --primary-ink:#241A2B;
      --primary-tint:#372B42;
      --accent:#D8A85A;
      --accent-tint:#3B3122;
      --success:#6FBB8B;
      --success-tint:#20342A;
      --danger:#E58A78;
      --danger-tint:#3A241F;
      --warning:#E0954A;
      --warning-tint:#3A2C1B;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1D1720;
    --surface:#272029;
    --surface-muted:#231D26;
    --line:#3B3340;
    --ink:#F1EBEE;
    --ink-dim:#B9AEB6;
    --ink-faint:#8A7E86;
    --primary:#C9A8DA;
    --primary-ink:#241A2B;
    --primary-tint:#372B42;
    --accent:#D8A85A;
    --accent-tint:#3B3122;
    --success:#6FBB8B;
    --success-tint:#20342A;
    --danger:#E58A78;
    --danger-tint:#3A241F;
    --warning:#E0954A;
    --warning-tint:#3A2C1B;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Work Sans", -apple-system, "Segoe UI", sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
    text-wrap:balance;
    color:var(--ink);
  }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  .tabular{ font-variant-numeric: tabular-nums; }

  /* ---------- login ---------- */
  .login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    padding:20px;
  }
  .login-screen[hidden]{ display:none; }
  .login-card{
    width:100%;
    max-width:360px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:32px 28px;
  }
  .login-brand{ text-align:center; margin-bottom:22px; }
  .login-brand .name{ font-family:"Fraunces",serif; font-weight:600; font-size:24px; color:var(--ink); }
  .login-brand .sub{ font-size:13px; color:var(--ink-faint); margin-top:2px; }
  .login-error{
    background:var(--danger-tint); color:var(--danger);
    border-radius:var(--radius-sm); padding:10px 12px;
    font-size:13px; margin-bottom:14px;
  }
  .sidebar-footer{
    margin-top:auto;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-faint);
  }
  .sidebar-footer .user-email{ font-size:12.5px; color:var(--ink-dim); margin-bottom:6px; word-break:break-all; }

  /* ---------- shell ---------- */
  .app-shell{
    display:flex;
    min-height:100vh;
  }
  .app-shell[hidden]{ display:none; }
  .sidebar{
    width:240px;
    flex:none;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
    gap:22px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{
    width:38px;height:38px;border-radius:50%;
    background:var(--primary); color:var(--primary-ink);
    display:flex;align-items:center;justify-content:center;flex:none;
    overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand-text .name{ font-family:"Fraunces",serif; font-weight:600; font-size:17px; line-height:1.1; }
  .brand-text .sub{ font-size:11.5px; color:var(--ink-faint); }

  .nav{ display:flex; flex-direction:column; gap:4px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:var(--radius-sm);
    background:transparent; border:none; text-align:left; width:100%;
    color:var(--ink-dim); font-weight:500;
  }
  .nav-item svg{ flex:none; opacity:0.85; }
  .nav-item .label{ flex:1; }
  .nav-item .badge{
    font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px;
    background:var(--primary-tint); color:var(--primary);
  }
  .nav-item .badge.badge-alert{ background:var(--danger-tint); color:var(--danger); }
  .nav-item .badge.badge-soft{ background:var(--warning-tint); color:var(--warning); }
  .nav-item.active{ background:var(--primary-tint); color:var(--primary); }
  .nav-item.active svg{ opacity:1; }
  .nav-item:hover:not(.active){ background:var(--surface-muted); color:var(--ink); }

  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:6px; }
  .ghost-link{
    background:none;border:none;color:var(--ink-faint);font-size:12px;
    text-align:left; padding:6px; border-radius:8px;
  }
  .ghost-link:hover{ color:var(--ink-dim); background:var(--surface-muted); }

  .main{ flex:1; min-width:0; padding:28px 32px 60px; max-width:1100px; }
  .main-header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    margin-bottom:22px; flex-wrap:wrap;
  }
  .main-header h1{ font-size:26px; margin:0; }
  .main-header .desc{ color:var(--ink-dim); font-size:13.5px; margin-top:4px; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 16px; border-radius:999px; border:1px solid transparent;
    font-weight:600; font-size:13.5px; white-space:nowrap;
  }
  .btn-primary{ background:var(--primary); color:var(--primary-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:var(--surface); border-color:var(--line); color:var(--ink-dim); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .btn-danger-ghost{ background:transparent; border-color:var(--line); color:var(--danger); }
  .btn-danger-ghost:hover{ background:var(--danger-tint); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .icon-btn{
    background:transparent;border:1px solid var(--line);border-radius:9px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }

  /* ---------- pills / tabs ---------- */
  .pillbar{ display:flex; gap:6px; background:var(--surface-muted); padding:4px; border-radius:999px; width:fit-content; }
  .pill{ border:none; background:transparent; padding:7px 16px; border-radius:999px; font-weight:600; font-size:13px; color:var(--ink-dim); }
  .pill.active{ background:var(--surface); color:var(--primary); box-shadow:var(--shadow); }

  /* ---------- calendário semanal ---------- */
  .cal-toolbar{ display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .cal-grid-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
  .cal-grid{ display:grid; grid-template-columns:56px repeat(7,minmax(112px,1fr)); min-width:840px; }
  .cal-row{ display:contents; }
  .cal-head-row .cal-daycol-head, .cal-head-row .cal-time{ position:sticky; top:0; background:var(--surface); z-index:1; border-bottom:1px solid var(--line); }
  .cal-daycol-head{ padding:10px 6px; text-align:center; border-left:1px solid var(--line); }
  .cal-daycol-head.is-today{ background:var(--primary-tint); }
  .cal-daycol-head .dow{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.03em; }
  .cal-daycol-head .dnum{ font-family:"Fraunces",serif; font-weight:600; font-size:16px; }
  .cal-time{ font-size:11px; color:var(--ink-faint); padding:6px 6px; text-align:right; position:sticky; left:0; background:var(--surface); border-right:1px solid var(--line); white-space:nowrap; }
  .cal-cell{ border-left:1px solid var(--line); border-top:1px solid var(--line); min-height:34px; padding:2px; display:flex; flex-direction:column; gap:2px; justify-content:center; }
  .cal-cell.is-closed{ background:repeating-linear-gradient(135deg, var(--surface-muted), var(--surface-muted) 6px, var(--line) 6px, var(--line) 7px); opacity:0.5; }
  .cal-cell.is-open .cal-add{
    width:100%; height:100%; min-height:28px; border:1px dashed var(--line); border-radius:6px;
    background:transparent; color:var(--ink-faint); font-size:14px; opacity:0; transition:opacity 0.1s;
  }
  .cal-cell.is-open:hover .cal-add{ opacity:1; }
  .cal-chip{
    width:100%; text-align:left; border:none; border-radius:6px; padding:4px 6px;
    background:var(--primary-tint); color:var(--primary); font-size:11.5px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cal-chip.is-done{ background:var(--success-tint); color:var(--success); }

  /* ---------- cards / lists ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); }
  .empty{
    background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius);
    padding:40px 24px; text-align:center; color:var(--ink-dim);
  }
  .empty .display{ font-size:17px; margin-bottom:6px; color:var(--ink); }

  .row-list{ display:flex; flex-direction:column; gap:10px; }
  .item-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .item-card.inactive{ opacity:0.55; }

  .badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge-agendado{ background:var(--accent-tint); color:var(--accent); }
  .badge-concluido{ background:var(--success-tint); color:var(--success); }
  .badge-cancelado{ background:var(--surface-muted); color:var(--ink-faint); text-decoration:line-through; }
  .badge-low{ background:var(--warning-tint); color:var(--warning); }
  .badge-auto{ background:var(--primary-tint); color:var(--primary); }
  .badge-manual{ background:var(--surface-muted); color:var(--ink-dim); }

  .chip{ font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--surface-muted); color:var(--ink-dim); }

  /* ---------- agenda ---------- */
  .date-nav{ display:flex; align-items:center; gap:8px; }
  .date-nav input[type="date"]{
    border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:8px 10px;
  }
  .appt-row{ display:flex; align-items:center; gap:14px; }
  .appt-time{ font-family:"Fraunces",serif; font-size:18px; font-weight:600; width:64px; flex:none; }
  .appt-main{ flex:1; min-width:180px; }
  .appt-client{ font-weight:600; }
  .appt-service{ font-size:13px; color:var(--ink-dim); }
  .appt-price{ font-weight:600; width:90px; text-align:right; flex:none; }
  .appt-actions{ display:flex; gap:6px; flex:none; }

  /* ---------- stat tiles ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
  .stat-tile .label{ font-size:12px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .stat-tile .value{ font-family:"Fraunces",serif; font-size:26px; font-weight:600; margin-top:4px; }
  .stat-tile.success .value{ color:var(--success); }
  .stat-tile.danger .value{ color:var(--danger); }
  .stat-tile.warn .value{ color:var(--warning); }

  .tx-row{ display:flex; align-items:center; gap:12px; padding:12px 16px; }
  .tx-desc{ flex:1; min-width:160px; }
  .tx-date{ font-size:12px; color:var(--ink-faint); }
  .tx-amount{ font-weight:600; width:110px; text-align:right; flex:none; }
  .tx-amount.pos{ color:var(--success); }
  .tx-amount.neg{ color:var(--danger); }
  .divider-row{ border-top:1px solid var(--line); }

  .dose-bar{ height:6px; border-radius:999px; background:var(--surface-muted); overflow:hidden; margin-top:8px; max-width:260px; }
  .dose-bar-fill{ height:100%; background:var(--primary); border-radius:999px; }

  /* ---------- forms ---------- */
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink-dim); }
  .field input[type=text], .field input[type=tel], .field input[type=number],
  .field input[type=date], .field input[type=time], .field input[type=month],
  .field select, .field textarea{
    border:1px solid var(--line); background:var(--surface-muted); border-radius:9px;
    padding:9px 11px; width:100%;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:flex; gap:12px; }
  .field-row > .field{ flex:1; }
  .checkfield{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .checkfield input{ width:16px;height:16px; }
  .subrow{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .subrow select{ flex:2; border:1px solid var(--line); background:var(--surface-muted); border-radius:8px; padding:7px 9px; }
  .subrow input{ flex:1; border:1px solid var(--line); background:var(--surface-muted); border-radius:8px; padding:7px 9px; }
  .subrow button{ flex:none; }
  .link-btn{ background:none;border:none;color:var(--primary);font-weight:600;font-size:13px;padding:4px 0; }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(30,22,28,0.42); backdrop-filter:blur(1px);
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px;
    z-index:50; overflow-y:auto;
  }
  .overlay[hidden]{ display:none; }
  .modal{
    background:var(--surface); border-radius:16px; box-shadow:var(--shadow);
    width:100%; max-width:480px; padding:22px 22px 20px; margin-bottom:40px;
  }
  .modal h2{ font-size:19px; margin:0 0 16px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

  .banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--accent-tint); color:var(--accent); border-radius:12px;
    padding:10px 16px; margin-bottom:18px; font-size:13px; font-weight:500;
  }
  .banner button{ background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;font-size:12.5px; }

  /* ---------- mobile ---------- */
  .mobile-topbar{ display:none; }
  @media (max-width:860px){
    .app-shell{ flex-direction:column; }
    .sidebar{
      position:sticky; top:0; width:100%; height:auto; flex-direction:row;
      align-items:center; padding:10px 14px; border-right:none; border-bottom:1px solid var(--line);
      z-index:20; gap:12px;
    }
    .sidebar .brand{ flex:none; }
    .nav{ flex-direction:row; flex:1; overflow-x:auto; }
    .nav-item{ width:auto; flex:none; }
    .nav-item .label{ display:none; }
    .sidebar-footer{ display:none; }
    .main{ padding:20px 16px 50px; }
    .stat-grid{ grid-template-columns:1fr; }
    .field-row{ flex-direction:column; gap:0; }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen" hidden>
  <div class="login-card">
    <div class="login-brand">
      <div class="name">Duda Mazon</div>
      <div class="sub">Estética — painel administrativo</div>
    </div>
    <div class="field"><label for="loginEmail">E-mail</label><input type="email" id="loginEmail" autocomplete="username" placeholder="seu@email.com"></div>
    <div class="field"><label for="loginPassword">Senha</label><input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="login-error" id="loginError" hidden></div>
    <button class="btn btn-primary" id="loginSubmit" style="width:100%;">Entrar</button>
    <button type="button" class="link-btn" id="loginForgot" style="margin-top:12px;">Esqueci minha senha</button>
  </div>
</div>

<div class="app-shell" id="appShell" hidden>
  <aside class="sidebar">

  function sanitizeForFirestore(obj){
    if(Array.isArray(obj)) return obj.map(sanitizeForFirestore);
    if(obj && typeof obj === 'object' && !(obj instanceof Date)){
      const out = {};
      Object.keys(obj).forEach(k => { if(obj[k] !== undefined) out[k] = sanitizeForFirestore(obj[k]); });
      return out;
    }
    return obj;
  }

  function wrapCollection(ref){
    return {
      add(data){ return ref.add(sanitizeForFirestore(data)); },
      doc(id){
        const dref = id ? ref.doc(id) : ref.doc();
        return {
          id: dref.id,
          set(data, opts){ return dref.set(sanitizeForFirestore(data), opts); },
          update(data){ return dref.update(sanitizeForFirestore(data)); },
          delete(){ return dref.delete(); },
          get(){ return dref.get(); },
          collection(subName){ return wrapCollection(dref.collection(subName)); },
        };
      },
      where(field, op, value){ return ref.where(field, op, value); },
      get(){ return ref.get(); },
    };
  }
  function makeDb(realDb){
    return {
      collection(name){ return wrapCollection(realDb.collection(name)); },
      batch(){ return realDb.batch(); },
    };
  }

  async function restoreFromBackup(parsed){
    for(const name of COLLECTIONS){
      const current = (store[name] || []).slice();
      for(const d of current){ await db.collection(name).doc(d.id).delete(); }
      const items = Array.isArray(parsed[name]) ? parsed[name] : [];
      for(const item of items){
        const clone = Object.assign({}, item);
        const id = clone.id;
        delete clone.id;
        // preserva o id original pra não quebrar vínculos entre coleções (ex: packageId, doseLotId, appointmentId)
        if(id) await db.collection(name).doc(id).set(clone);
        else await db.collection(name).add(clone);
      }
    }
  }

  function startFirestoreSync(){
    if(dbSyncStarted) return;
    dbSyncStarted = true;
    const realDb = firebase.firestore();
    try{ realDb.enablePersistence({ synchronizeTabs: true }); }
    catch(e){ /* persistência offline indisponível neste navegador/aba — segue só online */ }
    db = makeDb(realDb);
    COLLECTIONS.forEach(name => {
      const unsub = realDb.collection(name).onSnapshot(snap => {
        store[name] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        readyFlags[name] = true;
        if(!dbReady && COLLECTIONS.every(c => readyFlags[c])) dbReady = true;
        syncAndRender();
      }, err => {
        console.error('Erro ao sincronizar '+name, err);
        connError = true;
        renderAll();
      });
      unsubscribers.push(unsub);
    });
  }

  /* ---- Horários de trabalho (padrão semanal + exceções + agendamento público) ---- */
  const WEEKDAYS = [
    { key:'sun', label:'Domingo' },
    { key:'mon', label:'Segunda' },
    { key:'tue', label:'Terça' },
    { key:'wed', label:'Quarta' },
    { key:'thu', label:'Quinta' },
    { key:'fri', label:'Sexta' },
    { key:'sat', label:'Sábado' },
  ];
  const WEEKDAY_KEYS = WEEKDAYS.map(w => w.key);
  function dowKey(dateISO){ const d = new Date(dateISO+'T00:00:00'); return WEEKDAY_KEYS[d.getDay()]; }
  function getWeeklyHours(){
    const doc = state.workHours.find(w => w.id === 'weekly');
    return (doc && doc.days) || {};
  }
  function getExceptionFor(dateISO){ return state.workHoursExceptions.find(e => e.id === dateISO); }
  // resolve o horário de trabalho de uma data específica: exceção (se houver) > padrão semanal
  function resolveWorkHours(dateISO){
    const exc = getExceptionFor(dateISO);
    if(exc) return { enabled: !!exc.enabled, start: exc.start||'', end: exc.end||'', isException: true };
    const weekly = getWeeklyHours();
    const day = weekly[dowKey(dateISO)];
    if(!day) return { enabled:false, start:'', end:'', isException:false };
    return { enabled: !!day.enabled, start: day.start||'', end: day.end||'', isException:false };
  }
  function publicBookingLink(){

  function addMinutesToTime(time, minutes){
    const [h,m] = String(time||'0:0').split(':').map(Number);
    const total = (h*60 + m + Number(minutes||0) + 1440) % 1440;
    return `${pad(Math.floor(total/60))}:${pad(total%60)}`;
  }
  function timeToMinutes(t){ const [h,m] = String(t||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); }
  function minutesToTime(m){ m = ((m%1440)+1440)%1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
  function startOfWeek(dateISO){ const d = new Date(dateISO+'T00:00:00'); return shiftDate(dateISO, -d.getDay()); }
  // mantém a coleção publicSlots (só ocupação, sem dados de cliente) em sincronia com os agendamentos —

  function writeAppointmentSlot(id, date, time, durationMin){

  function updateClientIndexStatus(phone, id, status){
    const norm = normalizePhone(phone);
    if(!norm || !id) return;
    db.collection('clientIndex').doc(norm).collection('bookings').doc(id).update({ status }).catch(()=>{});
  }
  // move o índice de um agendamento pro novo telefone quando o telefone da cliente é corrigido
  function moveClientIndexEntry(oldPhone, newPhone, id, data){
    if(normalizePhone(oldPhone) === normalizePhone(newPhone)){ writeClientIndexEntry(newPhone, id, data); return; }
    if(oldPhone) deleteClientIndexEntry(oldPhone, id);
    writeClientIndexEntry(newPhone, id, data);
  }
  // pendências financeiras unificadas: atendimentos concluídos + lotes por dose + pacotes de serviço, com pagamento pendente ou parcial
  function allReceivables(){
    const appts = receivables().map(a => ({
      kind:'appt', id:a.id, clientName:a.clientName, label:a.serviceName,
      total: a.totalAmount != null ? Number(a.totalAmount) : computeApptTotal(a),
      paid: Number(a.amountPaid||0), dueDate: a.dueDate||'', refDate: a.date, paymentStatus: a.paymentStatus,
    }));
    const doses = doseLotReceivables().map(l => ({
      kind:'dose', id:l.id, clientName:l.clientName, label:l.productName,
      total: Number(l.totalAmount), paid: Number(l.amountPaid||0), dueDate: l.dueDate||'',
      refDate: l.purchaseDate, paymentStatus: l.paymentStatus,
    }));
    const packages = packageReceivables().map(pk => ({
      kind:'package', id:pk.id, clientName:pk.clientName, label:`${pk.serviceName} (pacote)`,
      total: Number(pk.totalAmount), paid: Number(pk.amountPaid||0), dueDate: pk.dueDate||'',
      refDate: pk.purchaseDate, paymentStatus: pk.paymentStatus,
    }));
    return appts.concat(doses, packages);
  }
  function overdueReceivablesAll(){
    const t = todayISO();
    return allReceivables().filter(x => (x.dueDate || x.refDate) < t);
  }

  function renderAll(){
    const loginScreen = document.getElementById('loginScreen');
    const appShell = document.getElementById('appShell');
    if(!currentUser){
      loginScreen.hidden = false;
      appShell.hidden = true;
      wireLoginScreen();
      return;
    }
    loginScreen.hidden = true;
    appShell.hidden = false;
    renderNav();

    const main = document.getElementById('main');

    if(connError) statusBanner = `<div class="banner" style="background:var(--danger-tint);color:var(--danger);"><span>⚠ Não foi possível conectar ao banco de dados agora. Verifique sua internet — suas alterações não serão salvas até a conexão voltar.</span></div>`;
    else if(!dbReady) statusBanner = `<div class="banner"><span>⏳ Carregando seus dados...</span></div>`;
    if(ui.tab === 'agenda') main.innerHTML = statusBanner + agendaView();
    else if(ui.tab === 'calendario') main.innerHTML = statusBanner + calendarView();
    else if(ui.tab === 'catalog') main.innerHTML = statusBanner + catalogView();
    else if(ui.tab === 'horarios') main.innerHTML = statusBanner + horariosView();
    else if(ui.tab === 'pacotes') main.innerHTML = statusBanner + packagesView();
    else if(ui.tab === 'doses') main.innerHTML = statusBanner + dosesView();
    else if(ui.tab === 'financeiro') main.innerHTML = statusBanner + financeView();
    else if(ui.tab === 'manual') main.innerHTML = manualView();
    else main.innerHTML = statusBanner + backupView();
    wireMain();
  }

  function wireLoginScreen(){
    const emailInput = document.getElementById('loginEmail');
    const passInput = document.getElementById('loginPassword');
    const errorBox = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginSubmit');
    if(authError){ errorBox.hidden = false; errorBox.textContent = authError; }
    else { errorBox.hidden = true; }
    submitBtn.disabled = authBusy;
    submitBtn.textContent = authBusy ? 'Entrando...' : 'Entrar';
    const doLogin = () => {
      const email = emailInput.value.trim();
      const pass = passInput.value;
      if(!email || !pass){ authError = 'Preencha e-mail e senha.'; renderAll(); return; }
      authError = ''; authBusy = true; renderAll();
      firebase.auth().signInWithEmailAndPassword(email, pass).catch(err => {
        authBusy = false;
        authError = err && err.code === 'auth/invalid-credential' || err && err.code === 'auth/wrong-password' || err && err.code === 'auth/user-not-found'
          ? 'E-mail ou senha incorretos.'
          : 'Não foi possível entrar agora. Tente de novo em instantes.';
        renderAll();
      });
    };
    submitBtn.onclick = doLogin;
    [emailInput, passInput].forEach(inp => { inp.onkeydown = (e) => { if(e.key === 'Enter') doLogin(); }; });
    document.getElementById('loginForgot').onclick = () => {
      const email = emailInput.value.trim();
      if(!email){ authError = 'Digite seu e-mail acima e toque em "Esqueci minha senha" de novo.'; renderAll(); return; }
      firebase.auth().sendPasswordResetEmail(email).then(() => {
        authError = '';
        infoModal('E-mail enviado!', 'Se esse e-mail tiver uma conta, chegou um link pra criar uma senha nova. Confira também a caixa de spam.');
      }).catch(() => {
        infoModal('E-mail enviado!', 'Se esse e-mail tiver uma conta, chegou um link pra criar uma senha nova. Confira também a caixa de spam.');
      });
    };
  }

  /* ================= CALENDÁRIO (visão semanal) ================= */
  function calendarView(){
    const weekDates = [0,1,2,3,4,5,6].map(i => shiftDate(ui.calWeekStart, i));
    const today = todayISO();
    const dayHours = weekDates.map(d => resolveWorkHours(d));
    const weekAppts = state.appointments.filter(a => weekDates.includes(a.date) && a.status !== 'cancelado');

    let gridStartMin = null, gridEndMin = null;
    dayHours.forEach(h => {
      if(h.enabled && h.start && h.end){
        gridStartMin = gridStartMin==null ? timeToMinutes(h.start) : Math.min(gridStartMin, timeToMinutes(h.start));
        gridEndMin = gridEndMin==null ? timeToMinutes(h.end) : Math.max(gridEndMin, timeToMinutes(h.end));
      }
    });
    weekAppts.forEach(a => {
      const s = timeToMinutes(a.time||'0:0');
      const e = s + Number(a.duration||60);
      gridStartMin = gridStartMin==null ? s : Math.min(gridStartMin, s);
      gridEndMin = gridEndMin==null ? e : Math.max(gridEndMin, e);
    });
    if(gridStartMin==null){ gridStartMin = 8*60; gridEndMin = 20*60; }
    gridStartMin = Math.floor(gridStartMin/60)*60;
    gridEndMin = Math.max(gridEndMin, gridStartMin+60);
    gridEndMin = Math.ceil(gridEndMin/60)*60;

    const STEP = 30;
    const rows = [];
    for(let t=gridStartMin; t<gridEndMin; t+=STEP) rows.push(t);

    const weekLabel = `${fmtDate(weekDates[0])} a ${fmtDate(weekDates[6])}`;

    const headerCells = weekDates.map((d,i) => `
      <div class="cal-daycol-head ${d===today?'is-today':''}">
        <div class="dow">${WEEKDAYS[i].label.slice(0,3)}</div>
        <div class="dnum">${d.slice(8,10)}</div>
      </div>`).join('');

    const bodyRows = rows.map(t => {
      const timeLabel = minutesToTime(t);
      const cells = weekDates.map((d,i) => {
        const h = dayHours[i];
        const inHours = h.enabled && h.start && h.end && t >= timeToMinutes(h.start) && t < timeToMinutes(h.end);
        const dayAppts = weekAppts.filter(a => a.date === d && Math.floor(timeToMinutes(a.time||'0:0')/STEP)*STEP === t);
        if(dayAppts.length){
          return `<div class="cal-cell has-appt">${dayAppts.map(a => `<button type="button" class="cal-chip ${a.status==='concluido'?'is-done':''}" data-cal-edit="${a.id}" title="${esc(a.clientName)} — ${esc(a.serviceName)}">${esc(a.time)} ${esc(a.clientName)}</button>`).join('')}</div>`;
        }
        if(inHours){
          return `<div class="cal-cell is-open"><button type="button" class="cal-add" data-cal-add="${d}|${minutesToTime(t)}" title="Novo agendamento às ${minutesToTime(t)}">+</button></div>`;
        }
        return `<div class="cal-cell is-closed"></div>`;
      }).join('');
      return `<div class="cal-row"><div class="cal-time">${timeLabel}</div>${cells}</div>`;
    }).join('');

    return `
      <div class="main-header">
        <div>
          <h1>Calendário</h1>
          <div class="desc">Semana de ${weekLabel} — toque num horário livre pra agendar, ou num agendamento pra editar/desmarcar</div>
        </div>
      </div>
      <div class="cal-toolbar">
        <button class="btn btn-ghost btn-sm" id="calPrevWeek">${ICONS.chevL} Semana anterior</button>
        <button class="btn btn-ghost btn-sm" id="calTodayWeek">Esta semana</button>
        <button class="btn btn-ghost btn-sm" id="calNextWeek">Próxima semana ${ICONS.chevR}</button>
      </div>
      <div class="cal-grid-wrap">
        <div class="cal-grid">
          <div class="cal-row cal-head-row"><div class="cal-time"></div>${headerCells}</div>
          ${bodyRows}
        </div>
      </div>
    `;
  }

  /* ================= HORÁRIOS DE TRABALHO ================= */
  function horariosView(){
    const weekly = getWeeklyHours();
    const today = todayISO();
    const todayResolved = resolveWorkHours(today);
    const todayLabel = todayResolved.enabled
      ? `Hoje (${fmtDate(today)}) está <b>aberto</b> das <b>${todayResolved.start}</b> às <b>${todayResolved.end}</b>${todayResolved.isException ? ' (exceção configurada pra hoje)' : ''}.`
      : `Hoje (${fmtDate(today)}) está <b>fechado</b> pro agendamento público${todayResolved.isException ? ' (exceção configurada pra hoje)' : ' — nenhum horário padrão definido pra esse dia da semana'}.`;

    const weeklyRows = WEEKDAYS.map(w => {
      const day = weekly[w.key] || { enabled:false, start:'13:00', end:'19:00' };
      return `
        <div class="item-card" style="flex-wrap:wrap;">
          <div class="checkfield" style="margin:0;min-width:150px;">
            <input type="checkbox" id="wh_${w.key}_on" ${day.enabled ? 'checked' : ''}>
            <label for="wh_${w.key}_on">${w.label}</label>
          </div>
          <div class="field-row" style="flex:1;margin:0;min-width:200px;">
            <div class="field" style="margin:0;"><input type="time" id="wh_${w.key}_start" value="${day.start||'13:00'}"></div>
            <div class="field" style="margin:0;"><input type="time" id="wh_${w.key}_end" value="${day.end||'19:00'}"></div>
          </div>
        </div>`;
    }).join('');

    const exceptions = state.workHoursExceptions.slice().filter(e => e.id >= today).sort((a,b) => a.id.localeCompare(b.id));
    const exceptionsHTML = exceptions.length ? exceptions.map(e => `
      <div class="item-card">
        <div style="flex:1;">
          <div class="appt-client">${fmtDateLong(e.id)}</div>
          <div class="appt-service">${e.enabled ? `Aberto das ${e.start} às ${e.end}` : 'Fechado (folga)'}</div>
        </div>
        <div class="appt-actions">
          <button class="icon-btn" title="Remover exceção" data-delete-exception="${e.id}">${ICONS.trash}</button>
        </div>
      </div>`).join('') : `<div class="empty" style="padding:18px;"><div>Nenhuma exceção cadastrada — os dias seguem o horário padrão acima.</div></div>`;

    const link = publicBookingLink();

    return `
      <div class="main-header">
        <div>
          <h1>Horários</h1>
          <div class="desc">Defina quando a Duda atende — isso controla o que aparece disponível no link público de agendamento</div>
        </div>
      </div>

      <div class="card" style="padding:18px 20px;margin-bottom:18px;">
        <p style="margin:0 0 10px;font-size:14px;">${todayLabel}</p>
        <div class="field" style="margin-bottom:8px;"><label>Link de agendamento pra enviar às clientes</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <input type="text" id="publicLinkInput" readonly value="${link}" style="flex:1;min-width:200px;">
            <button class="btn btn-ghost" id="copyLinkBtn">Copiar link</button>
          </div>
        </div>
      </div>

      <div class="card" style="padding:18px 20px;margin-bottom:18px;">
        <h3 style="margin:0 0 4px;">Horário padrão da semana</h3>
        <p style="font-size:13px;color:var(--ink-dim);margin:0 0 14px;">Marque os dias que a Duda atende e o horário de cada um. Fica valendo toda semana, até você mudar de novo.</p>
        <div class="row-list">${weeklyRows}</div>
        <div class="modal-actions" style="margin-top:14px;">
          <button class="btn btn-primary" id="saveWeeklyBtn">Salvar horário padrão</button>
        </div>
      </div>

      <div class="card" style="padding:18px 20px;">
        <h3 style="margin:0 0 4px;">Exceções (um dia específico diferente do padrão)</h3>
        <p style="font-size:13px;color:var(--ink-dim);margin:0 0 14px;">Use pra uma folga pontual ou um horário estendido/reduzido só naquele dia — sem mexer no padrão da semana.</p>
        <div class="field-row">
          <div class="field"><label for="excDate">Data</label><input type="date" id="excDate" min="${today}" value="${today}"></div>
          <div class="checkfield" style="align-self:flex-end;margin-bottom:14px;"><input type="checkbox" id="excFolga" checked><label for="excFolga">Folga (fechado o dia todo)</label></div>
        </div>
        <div class="field-row" id="excHoursRow" style="display:none;">
          <div class="field"><label for="excStart">Início</label><input type="time" id="excStart" value="13:00"></div>
          <div class="field"><label for="excEnd">Fim</label><input type="time" id="excEnd" value="19:00"></div>
        </div>
        <div class="modal-actions" style="justify-content:flex-start;margin-bottom:18px;">
          <button class="btn btn-primary" id="saveExceptionBtn">Salvar exceção</button>
        </div>
        <div class="row-list">${exceptionsHTML}</div>
      </div>

  /* ================= PACOTES DE SERVIÇO ================= */
  function packagesView(){
    const active = activePackages();
    const finished = finishedPackages();

    const rowHTML = (pk) => {
      const total = Number(pk.sessionsTotal) || 0;
      const used = Number(pk.sessionsUsed) || 0;
      const pct = total > 0 ? Math.max(0, Math.min(100, Math.round((used/total)*100))) : 0;
      const isFinished = used >= total;
      const unscheduled = packageUnscheduledCount(pk);
      const tracked = pk.totalAmount != null;
      const amtTotal = Number(pk.totalAmount) || 0;
      const amtPaid = Number(pk.amountPaid) || 0;
      const saldo = Math.max(0, amtTotal - amtPaid);
      const overdue = tracked && saldo > 0 && (pk.dueDate || pk.purchaseDate) < todayISO();
      const payBadge = !tracked ? '' : saldo <= 0 ? '' : overdue ? ` <span class="badge badge-alert">Vencido</span>` : ` <span class="badge badge-low">${pk.paymentStatus==='parcial'?'Parcial':'Pendente'}</span>`;
      const payLine = tracked ? `<div class="tx-date" style="margin-top:4px;">Pago ${fmtMoney(amtPaid)} de ${fmtMoney(amtTotal)}${payBadge}</div>` : '';
      return `<div class="item-card ${isFinished?'inactive':''}">
        <div style="flex:1;min-width:200px;">
          <div class="appt-client">${esc(pk.clientName)}${pk.clientPhone?` <span class="chip">${esc(pk.clientPhone)}</span>`:''}</div>
          <div class="appt-service">${esc(pk.serviceName)}${pk.purchaseDate?` · comprado em ${fmtDate(pk.purchaseDate)}`:''}${unscheduled>0?` <span class="chip">${unscheduled} sessão(ões) sem data</span>`:''}</div>
          <div class="dose-bar"><div class="dose-bar-fill" style="width:${pct}%;"></div></div>
          ${payLine}
        </div>
        <div class="appt-price tabular" style="width:auto;text-align:right;">${used} / ${total} sessões</div>
        <div class="appt-actions">
          ${tracked && saldo > 0 ? `<button class="btn btn-primary btn-sm" data-register-package-payment="${pk.id}">Registrar pagamento</button>` : ''}
          ${unscheduled > 0 ? `<button class="btn btn-primary btn-sm" data-schedule-session="${pk.id}">Agendar sessão</button>` : ''}
          ${isFinished ? `<span class="badge badge-cancelado">Finalizado</span>` : ''}
          <button class="icon-btn" title="Editar" data-edit-package="${pk.id}">${ICONS.edit}</button>
          <button class="icon-btn" title="Excluir" data-delete-package="${pk.id}">${ICONS.trash}</button>
        </div>
      </div>`;
    };

    const activeBlock = active.length
      ? `<div class="row-list">${active.map(rowHTML).join('')}</div>`
      : `<div class="empty"><div class="display">Nenhum pacote em andamento</div><div>Cadastre um pacote quando uma cliente comprar várias sessões do mesmo serviço de uma vez (ex: pacote de 4 massagens).</div><div style="margin-top:14px;"><button class="btn btn-primary" id="emptyNewPackage">${ICONS.plus} Novo pacote</button></div></div>`;

    const finishedBlock = finished.length ? `
      <div style="margin-top:28px;">
        <h3 style="font-size:13px;color:var(--ink-dim);margin:0 0 10px;font-family:'Work Sans',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;">Finalizados</h3>
        <div class="row-list">${finished.map(rowHTML).join('')}</div>
      </div>` : '';

    return `
      <div class="main-header">
        <div>
          <h1>Pacotes</h1>
          <div class="desc">Pacotes de várias sessões do mesmo serviço, vendidos de uma vez</div>
        </div>
        <button class="btn btn-primary" id="newPackageBtn">${ICONS.plus} Novo pacote</button>
      </div>
      ${activeBlock}
      ${finishedBlock}
    `;
  }

  /* ================= FINANCEIRO ================= */
  function financeView(){
    const monthTx = state.financeiro.filter(t => (t.date||'').slice(0,7) === ui.month)
      .sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
    const receitas = monthTx.filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount||0),0);
    const despesas = monthTx.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount||0),0);
    const saldo = receitas - despesas;
    const pending = allReceivables();
    const totalReceivable = pending.reduce((s,x) => s + Math.max(0, x.total - x.paid), 0);

    // resumo mensal: comparação com o mês anterior
    const prevMonth = shiftMonth(ui.month, -1);
    const prevTx = state.financeiro.filter(t => (t.date||'').slice(0,7) === prevMonth);
    const prevReceitas = prevTx.filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.amount||0),0);
    const prevDespesas = prevTx.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount||0),0);
    const prevSaldo = prevReceitas - prevDespesas;
    const pctLabel = (curr, prev) => {
      if(!prev) return curr>0 ? '' : '';
      const pct = Math.round(((curr-prev)/Math.abs(prev))*100);
      const arrow = pct>0 ? '▲' : pct<0 ? '▼' : '—';
      const color = pct>0 ? 'var(--success)' : pct<0 ? 'var(--danger)' : 'var(--ink-faint)';
      return ` <span style="font-size:11.5px;color:${color};font-weight:600;">${arrow} ${Math.abs(pct)}%</span>`;
    };
    const monthLabel = new Date(ui.month+'-01T00:00:00').toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
    const prevMonthLabel = new Date(prevMonth+'-01T00:00:00').toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
    const summaryBlock = (prevTx.length || monthTx.length) ? `
      <div class="card" style="padding:16px 20px;margin-bottom:18px;">
        <div style="font-size:12px;color:var(--ink-faint);text-transform:capitalize;margin-bottom:6px;">Resumo de ${monthLabel} vs. ${prevMonthLabel}</div>
        <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:13.5px;">
          <div>Receitas: <b class="tabular">${fmtMoney(receitas)}</b>${pctLabel(receitas, prevReceitas)}</div>
          <div>Despesas: <b class="tabular">${fmtMoney(despesas)}</b>${pctLabel(despesas, prevDespesas)}</div>
          <div>Saldo: <b class="tabular" style="color:${saldo>=0?'var(--success)':'var(--danger)'}">${fmtMoney(saldo)}</b>${pctLabel(saldo, prevSaldo)}</div>
        </div>
      </div>` : '';

    const rows = monthTx.map(t => {
      const sign = t.type==='receita' ? '+' : '−';
      return `<div class="tx-row divider-row">
        <div class="tx-desc">
          <div>${esc(t.description)}${t.clientName?` <span style="color:var(--ink-faint);">· ${esc(t.clientName)}</span>`:''}</div>
          <div class="tx-date">${fmtDate(t.date)} · <span class="badge ${t.source==='auto'?'badge-auto':'badge-manual'}">${t.source==='auto'?'Automático':'Manual'}</span></div>
        </div>
        <div class="tx-amount tabular ${t.type==='receita'?'pos':'neg'}">${sign} ${fmtMoney(t.amount)}</div>
        <div style="width:64px;display:flex;gap:4px;justify-content:flex-end;">${t.source==='manual'?`<button class="icon-btn" title="Editar" data-edit-tx="${t.id}">${ICONS.edit}</button><button class="icon-btn" title="Excluir" data-delete-tx="${t.id}">${ICONS.trash}</button>`:''}</div>
      </div>`;
    }).join('');

    const list = monthTx.length ? `<div class="card" style="overflow:hidden;">${rows}</div>` : `<div class="empty"><div class="display">Nenhum lançamento neste mês</div><div>Atendimentos concluídos entram aqui automaticamente, ou adicione um lançamento manual.</div></div>`;

    return `
      <div class="main-header">
        <div>
          <h1>Financeiro</h1>
          <div class="desc">Receitas e despesas do studio</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="month" id="monthInput" value="${ui.month}" style="border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;">
          <button class="btn btn-primary" id="newTxBtn">${ICONS.plus} Novo lançamento</button>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-tile success"><div class="label">Receitas</div><div class="value tabular">${fmtMoney(receitas)}</div></div>
        <div class="stat-tile danger"><div class="label">Despesas</div><div class="value tabular">${fmtMoney(despesas)}</div></div>
        <div class="stat-tile"><div class="label">Saldo</div><div class="value tabular" style="color:${saldo>=0?'var(--success)':'var(--danger)'}">${fmtMoney(saldo)}</div></div>
        <div class="stat-tile warn"><div class="label">A receber</div><div class="value tabular">${fmtMoney(totalReceivable)}</div></div>
      </div>
      ${summaryBlock}
      ${receivablesBlock(pending)}
      ${list}
    `;
  }

  function receivablesBlock(pending){
    if(!pending || !pending.length) return '';
    const t = todayISO();
    const byClient = {};
    pending.forEach(x => {
      const saldo = Math.max(0, x.total - x.paid);
      if(!byClient[x.clientName]) byClient[x.clientName] = { total:0, count:0 };
      byClient[x.clientName].total += saldo;
      byClient[x.clientName].count += 1;
    });
    const multiClients = Object.entries(byClient).filter(([,v]) => v.count > 1).sort((a,b) => b[1].total - a[1].total);
    const consolidatedBlock = multiClients.length ? `
      <div style="margin-top:4px;margin-bottom:14px;">
        <h3 style="font-size:13px;color:var(--ink-dim);margin:0 0 10px;font-family:'Work Sans',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;">Total por cliente (mais de uma pendência)</h3>
        <div class="card" style="overflow:hidden;">
          ${multiClients.map(([name,v]) => `
            <div class="tx-row divider-row">
              <div class="tx-desc">${esc(name)} <span style="color:var(--ink-faint);">· ${v.count} pendências</span></div>
              <div class="tx-amount tabular neg">${fmtMoney(v.total)}</div>
            </div>`).join('')}
        </div>
      </div>` : '';
    const rows = pending.slice().sort((a,b) => (a.dueDate||a.refDate).localeCompare(b.dueDate||b.refDate)).map(x => {
      const saldo = Math.max(0, x.total - x.paid);
      const due = x.dueDate || '';
      const overdue = due ? due < t : (x.refDate < t);
      const dueLabel = due ? `venc. ${fmtDate(due)}` : `${x.kind==='dose'||x.kind==='package'?'comprado':'atendido'} em ${fmtDate(x.refDate)}`;
      const statusBadge = overdue ? `<span class="badge badge-alert">Vencido</span>` : `<span class="badge badge-low">${x.paymentStatus==='parcial'?'Parcial':'Pendente'}</span>`;
      const attr = x.kind==='dose' ? `data-register-dose-payment="${x.id}"` : x.kind==='package' ? `data-register-package-payment="${x.id}"` : `data-register-payment="${x.id}"`;
      return `<div class="tx-row divider-row">
        <div class="tx-desc">
          <div>${esc(x.clientName)} <span style="color:var(--ink-faint);">· ${esc(x.label)}</span></div>
          <div class="tx-date">${dueLabel} · pago ${fmtMoney(x.paid)} de ${fmtMoney(x.total)} ${statusBadge}</div>
        </div>
        <div class="tx-amount tabular neg">${fmtMoney(saldo)}</div>
        <div style="width:auto;"><button class="btn btn-primary btn-sm" ${attr}>Registrar pagamento</button></div>
      </div>`;
    }).join('');
    return `
      ${consolidatedBlock}
      <div style="margin-top:4px;margin-bottom:24px;">
        <h3 style="font-size:13px;color:var(--ink-dim);margin:0 0 10px;font-family:'Work Sans',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;">A receber</h3>
        <div class="card" style="overflow:hidden;">${rows}</div>
      </div>`;
  }

  /* ================= BACKUP ================= */

    const last = store.meta && store.meta.lastBackupAt;
    const lastLabel = last ? new Date(last).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : 'nunca';
    const overdue = needsBackup();

    return `
      <div class="main-header">
        <div>
          <h1>Backup</h1>
          <div class="desc">Guarde uma cópia dos seus dados de vez em quando</div>
        </div>
      </div>
      <div class="callout warn">
        <span class="ico">📦</span>
        <span>Os dados ficam salvos na nuvem (Firestore), mas nunca custa ter uma cópia extra. Baixar um backup de vez em quando é a forma de não perder tudo se algo der muito errado.</span>
      </div>
      <div class="card" style="padding:20px 22px;">
        <h3 style="margin:0 0 4px;">Baixar backup</h3>
        <p style="font-size:13.5px;color:var(--ink-dim);margin:0 0 4px;">Último backup: <b class="tabular">${lastLabel}</b>${overdue ? ' <span class="badge badge-low">Recomendado</span>' : ''}</p>
        <p style="font-size:13px;color:var(--ink-faint);margin:0 0 16px;">Salva um arquivo com todos os serviços, produtos, agendamentos e lançamentos financeiros. Guarde esse arquivo em algum lugar seguro (e-mail, nuvem, etc.).</p>
        <button class="btn btn-primary" id="exportBackupBtn">${ICONS.download} Baixar backup agora</button>
        <p style="font-size:12px;color:var(--ink-faint);margin:12px 0 0;">Depois de baixar, envie o arquivo pra você mesma por e-mail, WhatsApp ("Mensagens para você") ou salve numa nuvem (Google Drive, iCloud) — assim fica seguro mesmo se perder o aparelho.</p>

      <div class="card" style="padding:20px 22px;">

      </div>
      <div class="card" style="padding:20px 22px;">
        <h3 style="margin:0 0 8px;">Dados de exemplo</h3>
        <p style="font-size:13px;color:var(--ink-dim);margin:0 0 14px;">Remove de uma vez os serviços, produtos, agendamentos e lançamentos marcados como exemplo.</p>
        <button class="btn btn-danger-ghost" id="clearExampleBtn">Remover dados de exemplo</button>
      </div>
    `;
  }

      ${sec('📅 Agenda', `

        ${p('<b>Editar ou cancelar:</b> enquanto o atendimento ainda não aconteceu ("Agendado"), dá pra editar (ícone de lápis) ou cancelar.')}

      document.getElementById('todayBtn').onclick = () => { ui.date = todayISO(); renderAll(); };

      document.querySelectorAll('[data-register-payment]').forEach(b => b.onclick = () => openRegisterPaymentModal(state.appointments.find(a=>a.id===b.dataset.registerPayment)));

      document.querySelectorAll('[data-delete-package]').forEach(b => b.onclick = () => confirmModal('Excluir este pacote? Os agendamentos (agendados ou já realizados) ligados a ele também serão excluídos.', () => deletePackageCascade(b.dataset.deletePackage)));

    }

      document.querySelectorAll('[data-apply-dose]').forEach(b => b.onclick = () => openApplyDoseModal(state.doseLots.find(l=>l.id===b.dataset.applyDose)));

  function shiftDate(iso, delta){
    const d = new Date(iso+'T00:00:00');
    d.setDate(d.getDate()+delta);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function shiftMonth(yyyymm, delta){
    const [y,m] = yyyymm.split('-').map(Number);
    const d = new Date(y, m-1+delta, 1);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  }

  /* ================= MODALS ================= */
  const overlay = document.getElementById('overlay');
  const modalBox = document.getElementById('modalBox');

  function closeModal(){ overlay.hidden = true; modalBox.innerHTML=''; }
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });

  function openModal(html){ modalBox.innerHTML = html; overlay.hidden = false; }

  function confirmModal(message, onYes){
    openModal(`
      <h2>Confirmar</h2>
      <p style="color:var(--ink-dim);margin:0 0 18px;">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cModalNo">Cancelar</button>
        <button class="btn btn-primary" id="cModalYes">Confirmar</button>
      </div>
    `);
    document.getElementById('cModalNo').onclick = closeModal;
    document.getElementById('cModalYes').onclick = () => { onYes(); closeModal(); };
  }

  function notReadyGuard(){
    if(!dbReady){ confirmModal('Ainda carregando a conexão com os dados. Tente novamente em instantes.', ()=>{}); return true; }
    return false;
  }

  /* ---- product rows shared by service & appointment forms ---- */
  function productRowHTML(rowId, selectedId, qty){
    const options = state.products.map(p => `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${esc(p.name)}</option>`).join('');
    return `<div class="subrow" data-row="${rowId}">
      <select data-row-product>${`<option value="">Selecione um produto</option>`+options}</select>
      <input type="number" min="1" step="1" value="${qty||1}" data-row-qty placeholder="Qtd">
      <button type="button" class="icon-btn" data-remove-row="${rowId}">${ICONS.trash}</button>
    </div>`;
  }

  function wireProductRows(containerId, addBtnId, initialRows){
    const container = document.getElementById(containerId);
    function addRow(sel,qty){ const rid=uid(); container.insertAdjacentHTML('beforeend', productRowHTML(rid, sel, qty)); wireRemove(); }
    function wireRemove(){ container.querySelectorAll('[data-remove-row]').forEach(b => b.onclick = () => container.querySelector(`[data-row="${b.dataset.removeRow}"]`).remove()); }
    (initialRows||[]).forEach(r => addRow(r.productId, r.qty));
    document.getElementById(addBtnId).onclick = () => addRow();
    wireRemove();
  }

  function readProductRows(containerId){
    const rows = [];
    document.querySelectorAll(`#${containerId} [data-row]`).forEach(r => {
      const pid = r.querySelector('[data-row-product]').value;
      const qty = Number(r.querySelector('[data-row-qty]').value) || 0;
      if(pid && qty>0){
        const p = productById(pid);
        if(p) rows.push({ productId:pid, name:p.name, qty });
      }
    });
    return rows;
  }

  /* ---- Service modal ---- */
  function openServiceModal(existing){
    if(notReadyGuard()) return;
    const isEdit = !!existing;
    openModal(`
      <h2>${isEdit?'Editar serviço':'Novo serviço'}</h2>
      <div class="field"><label for="svcName">Nome do serviço</label><input type="text" id="svcName" value="${esc(existing?.name||'')}" placeholder="Ex: Massagem Relaxante 60min"></div>
      <div class="field-row">
        <div class="field"><label for="svcPrice">Preço</label><input type="number" id="svcPrice" min="0" step="0.01" value="${existing?.price ?? ''}" placeholder="0,00"></div>
        <div class="field"><label for="svcDuration">Duração (minutos)</label><input type="number" id="svcDuration" min="5" step="5" value="${existing?.duration ?? 60}" placeholder="60"></div>
      </div>
      <div class="field">
        <label>Produtos utilizados neste serviço (opcional)</label>
        <div id="svcProductRows"></div>
        <button type="button" class="link-btn" id="svcAddRow">+ adicionar produto</button>
      </div>
      <div class="checkfield"><input type="checkbox" id="svcActive" ${existing?.active===false?'':'checked'}><label for="svcActive">Serviço ativo (aparece para novos agendamentos)</label></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="svcCancel">Cancelar</button>
        <button class="btn btn-primary" id="svcSave">Salvar</button>
      </div>
    `);
    wireProductRows('svcProductRows','svcAddRow', existing?.productsUsed);
    document.getElementById('svcCancel').onclick = closeModal;
    document.getElementById('svcSave').onclick = () => {
      const name = document.getElementById('svcName').value.trim();
      const price = Number(document.getElementById('svcPrice').value);
      const duration = Number(document.getElementById('svcDuration').value) || 60;
      if(!name || !(price>=0) || !(duration>0)){ return; }
      const data = {
        name, price, duration,
        productsUsed: readProductRows('svcProductRows'),
        active: document.getElementById('svcActive').checked,
      };
      if(isEdit) db.collection('services').doc(existing.id).update(data);
      else db.collection('services').add(Object.assign({ createdAt: Date.now() }, data));
      closeModal();
    };
  }

  /* ---- Product modal ---- */
  function openProductModal(existing){
    if(notReadyGuard()) return;
    const isEdit = !!existing;
    openModal(`
      <h2>${isEdit?'Editar produto':'Novo produto'}</h2>

      <div class="checkfield"><input type="checkbox" id="prdDoseControl" ${existing?.doseControl?'checked':''}><label for="prdDoseControl">Vendido por dose (cliente compra um total e usa aos poucos)</label></div>
      <div class="field" id="prdDoseUnitField" style="${existing?.doseControl?'':'display:none;'}">

        <button class="btn btn-primary" id="prdSave">Salvar</button>

    `);

    document.getElementById('prdCancel').onclick = closeModal;
    document.getElementById('prdSave').onclick = () => {
      const name = document.getElementById('prdName').value.trim();
      const price = Number(document.getElementById('prdPrice').value);

      const trackStock = document.getElementById('prdTrack').checked;
      const doseControl = document.getElementById('prdDoseControl').checked;
      const data = {
        name, price, trackStock,
        stock: trackStock ? Number(document.getElementById('prdStock').value)||0 : null,
        minStock: trackStock ? Number(document.getElementById('prdMin').value)||0 : null,

      if(isEdit) db.collection('products').doc(existing.id).update(data);

  /* ---- Dose lot modal ---- */
  function openDoseLotModal(existing){

      infoModal('Nenhum produto por dose cadastrado', 'Antes de criar um lote, vá em "Serviços e Produtos" e, ao cadastrar (ou editar) um produto, marque a opção "Vendido por dose (cliente compra um total e usa aos poucos)".');

    }
    const clientsMap = uniqueClientsMap();
    const clientOptions = Object.keys(clientsMap).map(n => `<option value="${esc(n)}"></option>`).join('');

    let productField;
    if(isEdit){
      productField = `<div class="field"><label>Produto</label><input type="text" value="${esc(existing.productName)} (${esc(existing.unit)})" disabled></div>`;
    } else {
      const prods = productsWithDoseControl();
      const prodOptions = prods.map(p => `<option value="${p.id}" data-unit="${esc(p.doseUnit||'mg')}">${esc(p.name)}</option>`).join('');
      productField = `<div class="field"><label for="dlProduct">Produto</label><select id="dlProduct">${prodOptions}</select></div>`;
    }

      <h2>${isEdit?'Editar lote':'Novo lote por dose'}</h2>

      <div class="field"><label for="dlPhone">Telefone (opcional)</label><input type="tel" id="dlPhone" value="${esc(existing?.clientPhone||'')}" placeholder="(00) 00000-0000"></div>
      ${productField}
      ${isEdit ? `
      <div class="field"><label for="dlDate">Data da compra</label><input type="date" id="dlDate" value="${existing.purchaseDate||todayISO()}"></div>
      <div style="font-size:12px;color:var(--ink-faint);margin-top:-10px;margin-bottom:14px;">Pra corrigir a quantidade total ou o produto, exclua este lote e crie um novo.</div>
      ` : `
      <div class="field-row">
        <div class="field"><label for="dlTotal">Quantidade total</label><input type="number" id="dlTotal" min="0.01" step="0.01" placeholder="Ex: 15"><div id="dlTotalHint" class="tabular" style="font-size:12px;color:var(--ink-faint);margin-top:4px;min-height:16px;"></div></div>
        <div class="field"><label for="dlDate">Data da compra</label><input type="date" id="dlDate" value="${todayISO()}"></div>
      </div>
      <div class="field"><label for="dlValue">Valor total combinado (opcional)</label><input type="number" id="dlValue" min="0" step="0.01" placeholder="0,00"></div>
      <div style="font-size:12px;color:var(--ink-faint);margin-top:-10px;margin-bottom:14px;">Preencha se quiser controlar o pagamento desse produto. Deixando em branco, o lote não entra no controle financeiro.</div>
      <div class="field" id="dlPayField" hidden>
        <label for="dlPayStatus">Pagamento</label>
        <select id="dlPayStatus">
          <option value="pago">Pago integralmente</option>
          <option value="parcial">Pago parcialmente</option>
          <option value="pendente">Ainda não pagou</option>
        </select>
      </div>
      <div class="field" id="dlPayAmountField" hidden>
        <label for="dlPayAmount">Valor pago agora</label>
        <input type="number" id="dlPayAmount" min="0" step="0.01" placeholder="0,00">
      </div>
      <div class="field" id="dlDueField" hidden>
        <label for="dlDue">Vencimento do restante (opcional)</label>
        <input type="date" id="dlDue" value="${shiftDate(todayISO(),7)}">
      </div>
      `}
      <div class="field"><label for="dlNote">Observações (opcional)</label><textarea id="dlNote" placeholder="Ex: aplicar 3mg por sessão">${esc(existing?.notes||'')}</textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="dlCancel">Cancelar</button>
        <button class="btn btn-primary" id="dlSave">Salvar</button>
      </div>
    `);
    document.getElementById('dlCancel').onclick = closeModal;
    if(!isEdit){
      const totalInput = document.getElementById('dlTotal');
      const hint = document.getElementById('dlTotalHint');
      const updateHint = () => {
        const v = toQty(totalInput.value);
        const selectEl = document.getElementById('dlProduct');
        const u = selectEl && selectEl.selectedOptions[0] ? selectEl.selectedOptions[0].dataset.unit : 'mg';
        hint.textContent = totalInput.value ? `= ${v} ${u}` : '';
      };
      totalInput.oninput = updateHint;
      const prodSelect = document.getElementById('dlProduct');
      if(prodSelect) prodSelect.onchange = updateHint;

      const valueInput = document.getElementById('dlValue');
      const payField = document.getElementById('dlPayField');
      const payStatusSel = document.getElementById('dlPayStatus');
      const payAmountField = document.getElementById('dlPayAmountField');
      const dueField = document.getElementById('dlDueField');
      const syncPayFields = () => {
        const hasValue = toQty(valueInput.value) > 0;
        payField.hidden = !hasValue;
        if(!hasValue){ payAmountField.hidden = true; dueField.hidden = true; return; }
        const v = payStatusSel.value;
        payAmountField.hidden = v !== 'parcial';
        dueField.hidden = v === 'pago';
      };
      valueInput.oninput = syncPayFields;
      payStatusSel.onchange = syncPayFields;
      syncPayFields();
    }
    document.getElementById('dlSave').onclick = () => {
      const clientName = document.getElementById('dlClient').value.trim();
      const clientPhone = document.getElementById('dlPhone').value.trim();
      const notes = document.getElementById('dlNote').value.trim();
      const date = document.getElementById('dlDate').value || todayISO();
      if(!clientName) return;
      if(isEdit){
        db.collection('doseLots').doc(existing.id).update({ clientName, clientPhone, notes, purchaseDate: date });
        closeModal();
        return;
      }
      const select = document.getElementById('dlProduct');
      const productId = select.value;
      const opt = select.selectedOptions[0];
      const unit = opt ? opt.dataset.unit : 'mg';
      const prod = productById(productId);
      const totalQty = toQty(document.getElementById('dlTotal').value);
      if(!productId || !(totalQty > 0)){
        infoModal('Quantidade inválida', 'Preencha a quantidade total com um número maior que zero (ex: 15). Use apenas números, sem a unidade (não digite "15mg", só "15").');
        return;
      }

      const value = toQty(document.getElementById('dlValue').value);
      let totalAmount = null, amountPaid = 0, paymentStatus = null, dueDate = '';
      if(value > 0){
        totalAmount = value;
        const payStatus = document.getElementById('dlPayStatus').value;
        amountPaid = payStatus === 'pago' ? totalAmount : payStatus === 'pendente' ? 0 : toQty(document.getElementById('dlPayAmount').value || 0);
        if(payStatus === 'parcial' && !(amountPaid > 0)){
          infoModal('Valor pago inválido', 'Você marcou "Pago parcialmente" — preencha quanto já foi pago (maior que zero).');
          return;
        }
        if(amountPaid > totalAmount) amountPaid = totalAmount;
        if(amountPaid < 0) amountPaid = 0;
        paymentStatus = amountPaid <= 0 ? 'pendente' : amountPaid >= totalAmount ? 'pago' : 'parcial';
        dueDate = payStatus === 'pago' ? '' : (document.getElementById('dlDue').value || '');
      }

      const payments = amountPaid > 0 ? [{ amount: amountPaid, date, note:'Pagamento na compra', createdAt: Date.now() }] : [];
      db.collection('doseLots').add({
        clientName, clientPhone, productId, productName: prod ? prod.name : '', unit,
        totalQty, remainingQty: totalQty, purchaseDate: date, notes, history: [],
        totalAmount, amountPaid, paymentStatus, dueDate, payments, createdAt: Date.now(),
      }).then(ref => {
        if(amountPaid > 0){
          db.collection('financeiro').add({
            type:'receita', description:`Produto por dose — ${prod ? prod.name : ''} (${clientName})`,
            amount: amountPaid, date, clientName, source:'auto', doseLotId: ref.id, createdAt: Date.now(),
          });
        }
      });
      closeModal();
    };
  }

  function openApplyDoseModal(lot){
    if(notReadyGuard() || !lot) return;
    const remaining = Number(lot.remainingQty) || 0;
    openModal(`
      <h2>Aplicar dose</h2>
      <p style="color:var(--ink-dim);margin:0 0 16px;">${esc(lot.clientName)} — ${esc(lot.productName)}<br>Restante: <b class="tabular">${remaining} ${esc(lot.unit)}</b></p>
      <div class="field"><label for="adQty">Quantidade aplicada (${esc(lot.unit)})</label><input type="number" id="adQty" min="0.01" step="0.01" placeholder="Ex: 3"><div id="adQtyHint" class="tabular" style="font-size:12px;color:var(--ink-faint);margin-top:4px;min-height:16px;"></div></div>
      <div class="field"><label for="adDate">Data</label><input type="date" id="adDate" value="${todayISO()}"></div>
      <div class="field"><label for="adNote">Observação (opcional)</label><input type="text" id="adNote" placeholder="Ex: sessão 2"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="adCancel">Cancelar</button>
        <button class="btn btn-primary" id="adSave">Registrar</button>
      </div>
    `);
    document.getElementById('adCancel').onclick = closeModal;
    {
      const qtyInput = document.getElementById('adQty');
      const hint = document.getElementById('adQtyHint');
      qtyInput.oninput = () => {
        const v = toQty(qtyInput.value);
        hint.textContent = qtyInput.value ? (v > remaining ? `= ${v} ${lot.unit} (será ajustado para ${remaining} ${lot.unit}, que é o restante)` : `= ${v} ${lot.unit} · restará ${(remaining - v).toFixed(2).replace(/\.?0+$/,'')} ${lot.unit}`) : '';
      };
    }
    document.getElementById('adSave').onclick = () => {
      let qty = toQty(document.getElementById('adQty').value);
      const date = document.getElementById('adDate').value || todayISO();
      const note = document.getElementById('adNote').value.trim();
      if(!(qty > 0)){
        infoModal('Quantidade inválida', 'Preencha a quantidade aplicada com um número maior que zero (ex: 3).');
        return;
      }
      if(qty > remaining) qty = remaining;
      const history = (lot.history||[]).concat([{ date, qty, note, createdAt: Date.now() }]);
      db.collection('doseLots').doc(lot.id).update({ remainingQty: remaining - qty, history });
      closeModal();
    };
  }

  function openRegisterDosePaymentModal(lot){
    if(notReadyGuard() || !lot) return;
    const total = Number(lot.totalAmount) || 0;
    const paid = Number(lot.amountPaid) || 0;
    const saldo = Math.max(0, total - paid);
    openModal(`
      <h2>Registrar pagamento</h2>
      <p style="color:var(--ink-dim);margin:0 0 16px;">${esc(lot.clientName)} — ${esc(lot.productName)}<br>Total: <b class="tabular">${fmtMoney(total)}</b> · Já pago: <b class="tabular">${fmtMoney(paid)}</b> · Falta: <b class="tabular">${fmtMoney(saldo)}</b></p>
      <div class="field"><label for="rdpAmount">Valor recebido agora</label><input type="number" id="rdpAmount" min="0" step="0.01" value="${saldo.toFixed(2)}"></div>
      <div class="field"><label for="rdpDate">Data do pagamento</label><input type="date" id="rdpDate" value="${todayISO()}"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="rdpCancel">Cancelar</button>
        <button class="btn btn-primary" id="rdpSave">Registrar</button>
      </div>
    `);
    document.getElementById('rdpCancel').onclick = closeModal;
    document.getElementById('rdpSave').onclick = () => {
      let amount = toQty(document.getElementById('rdpAmount').value || 0);
      const date = document.getElementById('rdpDate').value || todayISO();
      if(!(amount > 0)) return;
      if(amount > saldo) amount = saldo;
      const newPaid = paid + amount;
      const newStatus = newPaid >= total ? 'pago' : 'parcial';
      const payments = (lot.payments||[]).concat([{ amount, date, note:'Pagamento registrado', createdAt: Date.now() }]);
      db.collection('financeiro').add({
        type:'receita',
        description:`Pagamento — ${lot.productName} (${lot.clientName})`,
        amount, date, clientName: lot.clientName, source:'auto', doseLotId: lot.id, createdAt: Date.now(),
      });
      db.collection('doseLots').doc(lot.id).update({ amountPaid: newPaid, paymentStatus: newStatus, payments, dueDate: newStatus==='pago' ? '' : lot.dueDate });
      closeModal();
    };
  }

        totalAmount, amountPaid, paymentStatus, dueDate, payments, createdAt: Date.now(),
      }).then(ref => {
        sessionDates.forEach(sd => {
          db.collection('appointments').add({
            clientName, clientPhone, serviceId, serviceName: svc.name, servicePrice: svc.price,
            serviceProductsUsed: svc.productsUsed || [], date: sd.date, time: sd.time, extraProducts: [], notes: '',
            status:'agendado', packageId: ref.id, createdAt: Date.now(),
          }).then(apptRef => {
            writeAppointmentSlot(apptRef.id, sd.date, sd.time, svc.duration||60);
            writeClientIndexEntry(clientPhone, apptRef.id, { serviceName: svc.name, date: sd.date, time: sd.time, price: svc.price, status:'agendado', createdAt: Date.now() });
          });
        });
        if(amountPaid > 0){
          db.collection('financeiro').add({
            type:'receita', description:`Pacote — ${svc.name} (${clientName})`,
            amount: amountPaid, date, clientName, source:'auto', packageId: ref.id, createdAt: Date.now(),
          });
        }
      });
      closeModal();
    };
  }

  function openRegisterPackagePaymentModal(pk){
    if(notReadyGuard() || !pk) return;
    const total = Number(pk.totalAmount) || 0;
    const paid = Number(pk.amountPaid) || 0;
    const saldo = Math.max(0, total - paid);
    openModal(`
      <h2>Registrar pagamento</h2>
      <p style="color:var(--ink-dim);margin:0 0 16px;">${esc(pk.clientName)} — ${esc(pk.serviceName)}<br>Total: <b class="tabular">${fmtMoney(total)}</b> · Já pago: <b class="tabular">${fmtMoney(paid)}</b> · Falta: <b class="tabular">${fmtMoney(saldo)}</b></p>
      <div class="field"><label for="rppAmount">Valor recebido agora</label><input type="number" id="rppAmount" min="0" step="0.01" value="${saldo.toFixed(2)}"></div>
      <div class="field"><label for="rppDate">Data do pagamento</label><input type="date" id="rppDate" value="${todayISO()}"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="rppCancel">Cancelar</button>
        <button class="btn btn-primary" id="rppSave">Registrar</button>
      </div>
    `);
    document.getElementById('rppCancel').onclick = closeModal;
    document.getElementById('rppSave').onclick = () => {
      let amount = toQty(document.getElementById('rppAmount').value || 0);
      const date = document.getElementById('rppDate').value || todayISO();
      if(!(amount > 0)) return;
      if(amount > saldo) amount = saldo;
      const newPaid = paid + amount;
      const newStatus = newPaid >= total ? 'pago' : 'parcial';
      const payments = (pk.payments||[]).concat([{ amount, date, note:'Pagamento registrado', createdAt: Date.now() }]);
      db.collection('financeiro').add({
        type:'receita',
        description:`Pagamento — Pacote ${pk.serviceName} (${pk.clientName})`,
        amount, date, clientName: pk.clientName, source:'auto', packageId: pk.id, createdAt: Date.now(),
      });
      db.collection('packages').doc(pk.id).update({ amountPaid: newPaid, paymentStatus: newStatus, payments, dueDate: newStatus==='pago' ? '' : pk.dueDate });
      closeModal();
    };
  }

  // exclui um pacote e, junto, os agendamentos e lançamentos financeiros ligados a ele
  async function deletePackageCascade(id){
    try{
      const [finSnap, apptSnap] = await Promise.all([
        db.collection('financeiro').where('packageId','==',id).get(),
        db.collection('appointments').where('packageId','==',id).get(),
      ]);
      const deletes = [];
      finSnap.forEach(doc => deletes.push(db.collection('financeiro').doc(doc.id).delete()));
      apptSnap.forEach(doc => {
        deletes.push(db.collection('appointments').doc(doc.id).delete());
        deletes.push(db.collection('publicSlots').doc(doc.id).delete().catch(()=>{}));
        const phone = doc.data().clientPhone;
        if(phone) deletes.push(db.collection('clientIndex').doc(normalizePhone(phone)).collection('bookings').doc(doc.id).delete().catch(()=>{}));
      });
      await Promise.all(deletes);
    }catch(e){ console.error('Falha ao limpar dados do pacote', e); }
    db.collection('packages').doc(id).delete();
  }

  /* ---- Appointment modal ---- */
  function openAppointmentModal(existing, prefill){
    if(notReadyGuard()) return;
    const isEdit = !!existing;
    const svcList = activeServices();
    let svcOptions = svcList.map(s => `<option value="${s.id}" ${existing?.serviceId===s.id?'selected':''}>${esc(s.name)} — ${fmtMoney(s.price)}</option>`).join('');
    if(existing && !svcList.some(s => s.id === existing.serviceId)){
      const stale = serviceById(existing.serviceId);
      const staleLabel = stale ? `${esc(stale.name)} — ${fmtMoney(stale.price)} (inativo)` : `${esc(existing.serviceName)} (removido)`;
      svcOptions = `<option value="${existing.serviceId}" selected>${staleLabel}</option>` + svcOptions;
    }
    const clientsMap = uniqueClientsMap();
    const clientOptions = Object.keys(clientsMap).map(n => `<option value="${esc(n)}"></option>`).join('');
    openModal(`
      <h2>${isEdit?'Editar agendamento':'Novo agendamento'}</h2>
      <div class="field"><label for="apClient">Cliente</label><input type="text" id="apClient" list="apClientList" value="${esc(existing?.clientName||'')}" placeholder="Nome do cliente" autocomplete="off"><datalist id="apClientList">${clientOptions}</datalist></div>
      <div class="field"><label for="apPhone">Telefone (opcional)</label><input type="tel" id="apPhone" value="${esc(existing?.clientPhone||'')}" placeholder="(00) 00000-0000"></div>
      <div class="field"><label for="apService">Serviço</label><select id="apService"><option value="">Selecione um serviço</option>${svcOptions}</select></div>
      <div class="field-row">
        <div class="field"><label for="apDate">Data</label><input type="date" id="apDate" value="${existing?.date || (prefill && prefill.date) || ui.date}"></div>
        <div class="field"><label for="apTime">Horário</label><input type="time" id="apTime" value="${existing?.time || (prefill && prefill.time) || ''}"></div>
      </div>
      <div class="field">
        <label>Produtos extras vendidos (opcional)</label>
        <div id="apProductRows"></div>
        <button type="button" class="link-btn" id="apAddRow">+ adicionar produto</button>
      </div>
      <div class="field"><label for="apNotes">Observações</label><textarea id="apNotes" placeholder="Preferências, observações...">${esc(existing?.notes||'')}</textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="apCancel">Cancelar</button>
        <button class="btn btn-primary" id="apSave">Salvar</button>
      </div>
    `);
    wireProductRows('apProductRows','apAddRow', existing?.extraProducts);
    document.getElementById('apClient').addEventListener('input', function(){
      const known = clientsMap[this.value.trim()];
      const phoneInput = document.getElementById('apPhone');
      if(known && !phoneInput.value) phoneInput.value = known;
    });
    document.getElementById('apCancel').onclick = closeModal;
    document.getElementById('apSave').onclick = () => {
      const clientName = document.getElementById('apClient').value.trim();
      const serviceId = document.getElementById('apService').value;
      const date = document.getElementById('apDate').value;
      const time = document.getElementById('apTime').value;
      if(!clientName || !serviceId || !date || !time) return;
      const isStaleService = isEdit && existing.serviceId === serviceId && !svcList.some(s => s.id === serviceId);
      const svc = serviceById(serviceId);
      const extraProducts = readProductRows('apProductRows').map(r => {
        const p = productById(r.productId);
        return Object.assign({}, r, { price: p ? p.price : 0 });
      });
      const data = {
        clientName,
        clientPhone: document.getElementById('apPhone').value.trim(),
        serviceId,
        serviceName: svc ? svc.name : (isStaleService ? existing.serviceName : ''),
        servicePrice: svc ? svc.price : (isStaleService ? existing.servicePrice : 0),
        serviceProductsUsed: svc ? (svc.productsUsed || []) : (isStaleService ? (existing.serviceProductsUsed || []) : []),
        duration: svc ? (svc.duration||60) : (isStaleService ? (existing.duration||60) : 60),
        date, time,
        extraProducts,
        notes: document.getElementById('apNotes').value.trim(),
      };
      const conflict = state.appointments.some(a => a.status === 'agendado' && a.date === date && a.time === time && a.id !== (existing && existing.id));
      const save = () => {
        const idxEntry = { serviceName: data.serviceName, date, time, price: data.servicePrice, status:'agendado', createdAt: Date.now() };
        if(isEdit){
          db.collection('appointments').doc(existing.id).update(data);
          writeAppointmentSlot(existing.id, date, time, data.duration);
          moveClientIndexEntry(existing.clientPhone, data.clientPhone, existing.id, idxEntry);
        } else {
          db.collection('appointments').add(Object.assign({ status:'agendado', createdAt: Date.now() }, data))
            .then(ref => {
              writeAppointmentSlot(ref.id, date, time, data.duration);
              writeClientIndexEntry(data.clientPhone, ref.id, idxEntry);
            });
        }
        closeModal();
      };
      if(conflict){
        confirmModal(`Já existe outro agendamento às ${time} nesse dia. Salvar mesmo assim?`, save);
      } else {
        save();
      }
    };
  }

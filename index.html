  /* ================= actions with side effects ================= */
  function completeAppointment(id){
    const a = state.appointments.find(x => x.id === id);
    if(!a || a.status !== 'agendado') return;
    if(a.packageId){
      confirmModal(`Concluir esta sessão do pacote de ${a.clientName}? Já está coberta pelo pacote — não gera cobrança nova.`, () => completePackageSession(a));
      return;
    }
    openCompletePaymentModal(a);
  }

  function completePackageSession(a){
    const deductions = {};
    (a.serviceProductsUsed||[]).forEach(p => { deductions[p.productId] = (deductions[p.productId]||0) + Number(p.qty||0); });
    (a.extraProducts||[]).forEach(p => { deductions[p.productId] = (deductions[p.productId]||0) + Number(p.qty||0); });
    Object.keys(deductions).forEach(pid => {
      const p = productById(pid);
      if(p && p.trackStock){
        db.collection('products').doc(pid).update({ stock: Number(p.stock||0) - deductions[pid] });
      }
    });
    db.collection('appointments').doc(a.id).update({
      status:'concluido', completedAt: Date.now(), totalAmount: computeApptTotal(a),
    });
    updateClientIndexStatus(a.clientPhone, a.id, 'concluido');
    const pk = packageById(a.packageId);
    if(pk){
      db.collection('packages').doc(pk.id).update({ sessionsUsed: Math.min(pk.sessionsTotal||0, (pk.sessionsUsed||0) + 1) });
    }
  }

  function openCompletePaymentModal(a){
    const total = computeApptTotal(a);
    openModal(`
      <h2>Concluir atendimento</h2>
      <p style="color:var(--ink-dim);margin:0 0 16px;">${esc(a.clientName)} — ${esc(a.serviceName)} · Total: <b class="tabular">${fmtMoney(total)}</b></p>
      <div class="field">
        <label for="cpStatus">Pagamento</label>
        <select id="cpStatus">
          <option value="pago">Pago integralmente</option>
          <option value="parcial">Pago parcialmente</option>
          <option value="pendente">Ainda não pagou</option>
        </select>
      </div>
      <div class="field" id="cpAmountField" hidden>
        <label for="cpAmount">Valor pago agora</label>
        <input type="number" id="cpAmount" min="0" step="0.01" placeholder="0,00">
      </div>
      <div class="field" id="cpDueField" hidden>
        <label for="cpDue">Vencimento do restante (opcional)</label>
        <input type="date" id="cpDue" value="${shiftDate(a.date, 7)}">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cpCancel">Cancelar</button>
        <button class="btn btn-primary" id="cpSave">Concluir</button>
      </div>
    `);
    const statusSel = document.getElementById('cpStatus');
    const amountField = document.getElementById('cpAmountField');
    const dueField = document.getElementById('cpDueField');
    const syncFields = () => {
      const v = statusSel.value;
      amountField.hidden = v !== 'parcial';
      dueField.hidden = v === 'pago';
    };
    statusSel.onchange = syncFields;
    syncFields();
    document.getElementById('cpCancel').onclick = closeModal;
    document.getElementById('cpSave').onclick = () => {
      const v = statusSel.value;
      let amountPaid = v === 'pago' ? total : v === 'pendente' ? 0 : Number(document.getElementById('cpAmount').value || 0);
      if(v === 'parcial' && !(amountPaid > 0)) return;
      if(amountPaid > total) amountPaid = total;
      if(amountPaid < 0) amountPaid = 0;
      const dueDate = v === 'pago' ? '' : (document.getElementById('cpDue').value || '');
      const paymentStatus = amountPaid <= 0 ? 'pendente' : amountPaid >= total ? 'pago' : 'parcial';

      const deductions = {};
      (a.serviceProductsUsed||[]).forEach(p => { deductions[p.productId] = (deductions[p.productId]||0) + Number(p.qty||0); });
      (a.extraProducts||[]).forEach(p => { deductions[p.productId] = (deductions[p.productId]||0) + Number(p.qty||0); });
      Object.keys(deductions).forEach(pid => {
        const p = productById(pid);
        if(p && p.trackStock){
          db.collection('products').doc(pid).update({ stock: Number(p.stock||0) - deductions[pid] });
        }
      });

      const payments = [];
      if(amountPaid > 0){
        payments.push({ amount: amountPaid, date: todayISO(), note:'Pagamento no atendimento', createdAt: Date.now() });
        db.collection('financeiro').add({
          type:'receita',
          description:`Atendimento — ${a.serviceName} (${a.clientName})`,
          amount: amountPaid, date: a.date, source:'auto', appointmentId: a.id, createdAt: Date.now(),
        });
      }
      db.collection('appointments').doc(a.id).update({
        status:'concluido', completedAt: Date.now(), totalAmount: total,
        paymentStatus, amountPaid, payments, dueDate,
      });
      updateClientIndexStatus(a.clientPhone, a.id, 'concluido');
      closeModal();
    };
  }

  function openRegisterPaymentModal(a){
    if(!a) return;
    const total = a.totalAmount != null ? Number(a.totalAmount) : computeApptTotal(a);
    const paid = Number(a.amountPaid||0);
    const saldo = Math.max(0, total - paid);
    openModal(`
      <h2>Registrar pagamento</h2>
      <p style="color:var(--ink-dim);margin:0 0 16px;">${esc(a.clientName)} — ${esc(a.serviceName)}<br>Total: <b class="tabular">${fmtMoney(total)}</b> · Já pago: <b class="tabular">${fmtMoney(paid)}</b> · Falta: <b class="tabular">${fmtMoney(saldo)}</b></p>
      <div class="field"><label for="rpAmount">Valor recebido agora</label><input type="number" id="rpAmount" min="0" step="0.01" value="${saldo.toFixed(2)}"></div>
      <div class="field"><label for="rpDate">Data do pagamento</label><input type="date" id="rpDate" value="${todayISO()}"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="rpCancel">Cancelar</button>
        <button class="btn btn-primary" id="rpSave">Registrar</button>
      </div>
    `);
    document.getElementById('rpCancel').onclick = closeModal;
    document.getElementById('rpSave').onclick = () => {
      let amount = Number(document.getElementById('rpAmount').value || 0);
      const date = document.getElementById('rpDate').value || todayISO();
      if(!(amount > 0)) return;
      if(amount > saldo) amount = saldo;
      const newPaid = paid + amount;
      const newStatus = newPaid >= total ? 'pago' : 'parcial';
      const payments = (a.payments||[]).concat([{ amount, date, note:'Pagamento registrado', createdAt: Date.now() }]);
      db.collection('financeiro').add({
        type:'receita',
        description:`Pagamento — ${a.serviceName} (${a.clientName})`,
        amount, date, source:'auto', appointmentId: a.id, createdAt: Date.now(),
      });
      db.collection('appointments').doc(a.id).update({ amountPaid: newPaid, paymentStatus: newStatus, payments });
      closeModal();
    };
  }

  // exclui um lote por dose e, junto, qualquer lançamento no Financeiro ligado a ele (compra e/ou pagamentos registrados depois)
  async function deleteDoseLotCascade(id){
    try{
      const snap = await db.collection('financeiro').where('doseLotId','==',id).get();
      const deletes = [];
      snap.forEach(doc => deletes.push(db.collection('financeiro').doc(doc.id).delete()));
      await Promise.all(deletes);
    }catch(e){ console.error('Falha ao limpar lançamentos financeiros do lote', e); }
    db.collection('doseLots').doc(id).delete();
  }

  function cancelAppointment(id){
    const a = state.appointments.find(x => x.id === id);
    if(!a || a.status !== 'agendado') return;
    confirmModal(`Cancelar o agendamento de ${a.clientName}?`, () => {
      db.collection('appointments').doc(id).update({ status:'cancelado' });
      deleteAppointmentSlot(id);
      updateClientIndexStatus(a.clientPhone, id, 'cancelado');
    });
  }

  async function clearExamples(){
    if(!dbReady) return;
    confirmModal('Remover todos os dados de exemplo (serviços, produtos, agendamentos e lançamentos marcados como exemplo)?', async () => {
      for(const col of ['services','products','appointments','financeiro','doseLots']){
        const snap = await db.collection(col).where('isExample','==',true).get();
        for(const d of snap.docs){ await db.collection(col).doc(d.id).delete(); }
      }
    });
  }

})();
